<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1298 1212" class="opening-decoration" aria-hidden="true" focusable="false">
  <!-- A little wind, a growing idea, and the continuation of the paper road.
       Coordinates share the supplied illustration's untouched artboard. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="od-breeze" d="M142 249C226 191 273 178 330 194S430 227 490 194S550 129 589 128" stroke="#91a58a" stroke-width="2.4" opacity=".56"/>
    <path d="M157 265C231 217 282 210 329 218" stroke="#bcc5ab" stroke-width="1.6" opacity=".65"/>
    <path d="M599 129l12 1m-9-13 1-9" stroke="#bb9952" stroke-width="2.2" opacity=".66"/>

    <!-- Two airy leaves share the fox's pointed, curved geometry. -->
    <g class="od-leaf" style="transform-origin:289px 184px">
      <path d="M289 184C267 177 257 154 251 134C277 136 296 153 289 184Z" fill="#d9dfcb" stroke="#91a58a" stroke-width="1.6"/>
      <path d="M261 148Q281 164 289 184" stroke="#91a58a" stroke-width="1.4"/>
    </g>
    <g class="od-seed" style="transform-origin:487px 146px">
      <path d="M476 148Q482 135 499 137Q496 150 476 148Z" fill="#ead7a4" stroke="#c5a760" stroke-width="1.3"/>
      <path d="M476 148l-8 6" stroke="#c5a760" stroke-width="1.4"/>
    </g>
    <circle cx="395" cy="151" r="3.3" fill="#c98544" opacity=".58"/>
    <circle cx="131" cy="268" r="2.1" fill="#8ea087" opacity=".6"/>

    <!-- Open draft marks echo a sheet taking shape, above the actual tools. -->
    <g stroke="#a9b797" stroke-width="1.9" opacity=".58">
      <path d="M987 257l29-28 43 20-29 28-43-20Z"/>
      <path d="M1016 229l3 22 40-2m-40 2 11 26"/>
      <path d="M972 286l39 19m-52-7 25 12"/>
    </g>
    <path d="M1096 233l5-9m2 23 10-1" stroke="#c78c50" stroke-width="2.3" opacity=".6"/>

    <!-- Fine road-edge lines continue beyond the paper, across open ground. -->
    <path d="M1030 1136C884 1191 783 1132 663 1128C539 1124 487 1177 369 1133C279 1099 239 1036 165 1036" stroke="#a4b194" stroke-width="2" opacity=".43"/>
    <path class="od-road-trace" d="M1004 1157C863 1201 780 1150 662 1147C536 1144 478 1196 363 1151C271 1115 229 1054 164 1054" stroke="#af9a5e" stroke-width="2.2" stroke-dasharray="2 15" opacity=".58"/>
    <path d="M150 1036h-17m9-9v17" stroke="#96a58a" stroke-width="1.7" opacity=".5"/>
    <circle cx="331" cy="1116" r="4" fill="#df9d64" opacity=".62"/>

    <!-- A grounded, asymmetric sprig avoids an enclosing halo. -->
    <g class="od-sprig" style="transform-origin:135px 914px">
      <path d="M135 914Q150 878 137 838m6 53Q123 878 115 860m31 12Q164 858 167 839" stroke="#8c9f80" stroke-width="2" opacity=".64"/>
      <path d="M137 842Q118 827 124 808Q144 818 137 842Z" fill="#dde2d1" stroke="#a6b497" stroke-width="1.4"/>
      <path d="M166 842Q162 823 177 813Q182 832 166 842Z" fill="#e6dbb8" stroke="#bfa876" stroke-width="1.4"/>
      <path d="M117 863Q99 860 96 844Q113 845 117 863Z" fill="#d1dbc6" stroke="#a6b497" stroke-width="1.4"/>
    </g>
    <path d="M103 920Q138 929 172 917" stroke="#b5bca4" stroke-width="1.5" opacity=".45"/>
  </g>
</svg>
