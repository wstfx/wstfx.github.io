<svg class="ig-system-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" fill="none" role="img" aria-labelledby="ig-art-title ig-art-desc">
<title id="ig-art-title">Modeling a living delivery system</title>
<desc id="ig-art-desc">Engineered bacteria approach a cluster of tumor cells and release a signal. A mathematical model and a research wiki connect the biological mechanism with analysis and communication. Conceptual illustration.</desc>
