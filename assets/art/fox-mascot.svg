<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="mascot-title mascot-desc">
  <title id="mascot-title">A curious little fox</title>
  <desc id="mascot-desc">A friendly orange fox with triangular ears, cream cheeks and a generous brush tail. Five poses accompany the story: curious, listening, examining, building and nurturing.</desc>
  <style>.mascot-pose{display:none}.pose-0{display:inline}</style>
  <!--
    Original vector character inspired by Zebang's triangular fox identity.
    This is a new mascot, not a reconstruction of his original logo.
    Five equal-size poses are switched by the host page; no external assets.
    Animation hooks are real groups, not shadow-tree symbols:
      .fox-tail  origin 181 230 — a slow, small tail sway
      .fox-head  origin 150 147 — a gentle attentive tilt
      .fox-eyes  origin 148 124 — an occasional blink
      .fox-body  origin 149 247 — a quiet breath
    Static pose transforms sit on parent groups so CSS can animate the hooks.
    Every expression and prop remains within the 300×300 artboard.
  -->
